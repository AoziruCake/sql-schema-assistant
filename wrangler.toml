name = "sql-schema-assistant"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"

# Pages が読むビルド出力ディレクトリ（OpenNext の静的アセット）
pages_build_output_dir = ".open-next/assets"

compatibility_flags = [
  "nodejs_compat",
  "global_fetch_strictly_public",
]

# NOTE:
# Pages では "ASSETS" という binding 名は予約されているため、
# OpenNext 用の [assets] セクションと WASM rules は定義しません。
# 静的アセット配信は pages_build_output_dir の指定に任せます。

